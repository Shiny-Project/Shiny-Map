<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>JMA 指定河川洪水情报</title>
  <link rel="stylesheet" href="./legend.css">
  <style>
    body { margin: 0; color: white; font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    #map { width: 100vw; height: 100vh; background: #BEDBF9; }
    #heading { position: fixed; top: 2rem; left: 2rem; z-index: 2; }
    #title { display: inline-block; margin: 0; padding: .5rem 1rem; font-size: 32px; font-weight: 500; }
    #badge { display: none; padding: .5rem 1rem; margin-right: .5rem; background: #faf500; color: #222; font-size: 32px; }
    #panel { position: fixed; top: 2rem; right: 2rem; width: 350px; padding: 22px 24px; background: rgba(0,0,0,.65); z-index: 2; }
    .river + .river { margin-top: 16px; padding-top: 16px; border-top: 1px solid #ffffff55; }
    .river-name { margin: 0 0 8px; font-size: 30px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
    .river-summary { margin: 0; font-size: 24px; line-height: 1.5; }
    #remaining { margin: 6px 0 0; font-size: 20px; line-height: 1.4; color: #ddd; }
    #panel.multiple .river-name { font-size: 24px; margin-bottom: 2px; }
    #panel.multiple .river-summary { font-size: 21px; }
    .map-legend-swatch.occurred { box-sizing: border-box; border: 3px solid #ff9f00; }
    #footer { position: fixed; bottom: 0; right: 0; z-index: 3; padding: 0 1vw; background: #7e7e7e; opacity: .7; font: 1.7vh/2.2vh 'Consolas', 'Noto Serif CJK SC', monospace; }
  </style>
</head>
<body>
  <div id="map"></div>
  <header id="heading"><span id="badge"></span><h1 id="title">洪水情报</h1></header>
  <aside id="panel"></aside>
  <div id="legend" class="map-legend"></div>
  <footer id="footer">Generated by Shiny-Map.</footer>
  <script src="./flood.js" type="module"></script>
</body>
</html>
