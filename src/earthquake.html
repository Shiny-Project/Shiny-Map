<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>地震速报</title>
  <link rel="stylesheet" href="./legend.css">
  <style>
    body { margin: 0; color: white; font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    #map { width: 100vw; height: 100vh; background: #BEDBF9; }
    #heading { position: fixed; top: 2rem; left: 2rem; z-index: 2; }
    #title { display: inline-block; margin: 0; padding: .5rem 1rem; background: rgba(0,0,0,.65); font-size: 32px; font-weight: 500; }
    #panel { position: fixed; top: 2rem; right: 2rem; width: 350px; padding: 22px 24px; background: rgba(0,0,0,.65); z-index: 2; }
    #region { margin: 0 0 8px; font-size: 30px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
    #description { margin: 0; font-size: 24px; line-height: 1.5; overflow-wrap: anywhere; }
    #magnitude { margin: 16px 0; font-size: 56px; line-height: 1.2; font-weight: 500; }
    dl { margin: 0; padding-top: 16px; border-top: 1px solid #ffffff45; font-size: 22px; line-height: 1.65; }
    dt { color: #ddd; }
    dd { margin: 0 0 10px; }
    #revision { margin: 16px 0 0; padding-top: 16px; border-top: 1px solid #ffffff45; color: #ddd; font-size: 18px; line-height: 1.5; }
    .epicenter-icon { width: 24px; height: 24px; margin-right: 10px; }
    #footer { position: fixed; bottom: 0; right: 0; z-index: 3; padding: 0 1vw; background: #7e7e7e; opacity: .7; font: 1.7vh/2.2vh 'Consolas', 'Noto Serif CJK SC', monospace; }
  </style>
</head>
<body>
  <div id="map"></div>
  <header id="heading"><h1 id="title">地震速报</h1></header>
  <aside id="panel">
    <h2 id="region"></h2>
    <p id="description"></p>
    <p id="magnitude"></p>
    <dl><dt>震中</dt><dd id="epicenter"></dd><dt>震源深度</dt><dd id="depth"></dd></dl>
    <p id="revision">后续可能发生修订<br>请以最新情报为准</p>
  </aside>
  <div id="legend" class="map-legend"><div><img class="epicenter-icon" src="../data/images/epicenter.png" alt="">震中</div></div>
  <footer id="footer">Generated by Shiny-Map.</footer>
  <script src="./earthquake.js" type="module"></script>
</body>
</html>
