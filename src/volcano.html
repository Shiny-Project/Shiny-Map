<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>JMA 喷火警报与预报</title>
  <link rel="stylesheet" href="./legend.css">
  <style>
    body { margin: 0; color: white; font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    #map { width: 100vw; height: 100vh; background: #BEDBF9; }
    #heading { position: fixed; top: 2rem; left: 2rem; z-index: 2; max-width: 1330px; }
    #title { display: inline-block; margin: 0; padding: .5rem 1rem; background: #ff2800; font-size: 32px; font-weight: 500; }
    #badge { display: none; padding: .5rem 1rem; margin-right: .5rem; background: #faf500; color: #222; font-size: 32px; }
    #panel { position: fixed; top: 2rem; right: 2rem; width: 350px; padding: 22px 24px; background: rgba(0,0,0,.65); z-index: 2; font-size: 21px; }
    #volcano-name { margin: 0 0 14px; font-size: 30px; font-weight: 500; line-height: 1.45; overflow-wrap: anywhere; }
    #summary { margin: 0; font-size: 26px; line-height: 1.5; }
    .volcano-icon { width: 0; height: 0; margin: 0 12px 0 3px; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 17px solid white; }
    #footer { position: fixed; bottom: 0; right: 0; z-index: 3; padding: 0 1vw; background: #7e7e7e; opacity: .7; font: 1.7vh/2.2vh 'Consolas', 'Noto Serif CJK SC', monospace; }
  </style>
</head>
<body>
  <div id="map"></div>
  <header id="heading">
    <span id="badge"></span><h1 id="title">喷火警报</h1>
  </header>
  <aside id="panel">
    <h2 id="volcano-name"></h2>
    <p id="summary"></p>
  </aside>
  <div id="legend" class="map-legend"></div>
  <footer id="footer">Generated by Shiny-Map.</footer>
  <script src="./volcano.js" type="module"></script>
</body>
</html>
