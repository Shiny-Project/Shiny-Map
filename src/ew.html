<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>JMA 特别警报</title>
  <style>
    body { margin: 0; color: white; font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    #map { width: 100vw; height: 100vh; background: #BEDBF9; }
    #heading { position: fixed; top: 2rem; left: 2rem; z-index: 2; max-width: 1280px; }
    #title { display: inline-block; margin: 0; padding: .5rem 1rem; background: #9900CC; font-size: 32px; font-weight: 500; }
    #badge { display: none; padding: .5rem 1rem; margin-right: .5rem; background: #faf500; color: #222; font-size: 32px; }
    #panel { position: fixed; top: 2rem; right: 2rem; width: 350px; padding: 22px 24px; background: rgba(0,0,0,.65); z-index: 2; font-size: 21px; }
    #summary { font-size: 26px; margin: 0 0 16px; line-height: 1.5; }
    #summary.muted { color: #e0e4e8; }
    .section { border-top: 1px solid #ffffff45; padding-top: 14px; margin-top: 14px; }
    .section h2 { margin: 0 0 10px; font-size: 20px; font-weight: 500; color: #ddd; }
    .kind { line-height: 1.65; }
    #area-list, #ended-list { margin: 0; line-height: 1.7; overflow-wrap: anywhere; }
    #legend { position: fixed; bottom: 2rem; left: 2rem; z-index: 2; padding: .5rem 1rem; background: rgba(0,0,0,.55); font-size: 21px; }
    #legend div { display: flex; align-items: center; line-height: 1.8; }
    .swatch { display: inline-block; width: 30px; height: 18px; margin-right: 12px; border: 1px solid white; background: #9900CC; }
    .swatch.ended { background: #9da7b1; border-style: dashed; }
    #footer { position: fixed; bottom: 0; right: 0; z-index: 3; padding: 0 1vw; background: #7e7e7e; opacity: .7; font: 1.7vh/2.2vh 'Consolas', 'Noto Serif CJK SC', monospace; }
  </style>
</head>
<body>
  <div id="map"></div>
  <header id="heading">
    <span id="badge"></span><h1 id="title">特别警报</h1>
  </header>
  <aside id="panel">
    <p id="summary"></p>
    <div id="kinds"></div>
    <section class="section" id="active-section"><h2>生效区域</h2><p id="area-list"></p></section>
    <section class="section" id="ended-section"><h2>解除 / 降级区域</h2><p id="ended-list"></p></section>
  </aside>
  <div id="legend">
    <div><i class="swatch"></i>特别警报生效中</div>
    <div><i class="swatch ended"></i><span id="ended-legend">特别警报解除 / 降级</span></div>
  </div>
  <footer id="footer">Generated by Shiny-Map.</footer>
  <script src="./ew.js" type="module"></script>
</body>
</html>
